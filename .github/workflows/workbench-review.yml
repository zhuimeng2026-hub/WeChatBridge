name: Workbench review

on:
  pull_request:
    branches: [main]
    paths:
      - 'windows/**'
      - 'docs/design/obsidian-workbench/**'
      - '.github/workflows/workbench-review.yml'
  # 2026-10-24：原先还有一个 push 触发器写死 [feat/obsidian-workbench-variants]。
  # 那条分支合并进 main 后已经删除，那个触发器**永远不会触发**——留着只是
  # 一段看着像活的、实际是死的配置。pull_request（指向 main）+ workflow_dispatch
  # 覆盖了原本的能力：改 Windows 端代码提 PR 会跑，手动也能跑。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [Perpetual, Subscription]
    env:
      WECHATBRIDGE_UI_PREVIEW: ${{ github.workspace }}/windows/artifacts/ui-preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore windows/WeChatBridge.Windows.sln -p:WeChatBridgeEdition=${{ matrix.edition }}
      - name: Build
        run: dotnet build windows/WeChatBridge.Windows.sln -c Release --no-restore --nologo -p:WeChatBridgeEdition=${{ matrix.edition }}
      - name: Test and render native review screenshots
        run: dotnet test windows/WeChatBridge.Windows.sln -c Release --no-build --nologo -p:WeChatBridgeEdition=${{ matrix.edition }} --logger trx --results-directory windows/artifacts/test-results
      - name: Verify edition networking boundary
        shell: pwsh
        run: ./windows/scripts/Test-NoNetworkCode.ps1 -Edition ${{ matrix.edition }}
      - name: Build self-contained customer review payload
        shell: pwsh
        run: ./windows/scripts/build-app.ps1 -Edition ${{ matrix.edition }} -OutputDirectory windows/artifacts/review-app
      - name: Upload test and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-evidence-${{ matrix.edition }}
          path: |
            windows/artifacts/test-results
            windows/artifacts/ui-preview
          if-no-files-found: warn
          retention-days: 14
      - name: Upload customer review build
        uses: actions/upload-artifact@v4
        with:
          name: WeChatBridge-workbench-${{ matrix.edition }}-Windows-x64
          path: windows/artifacts/review-app
          if-no-files-found: error
          retention-days: 14
